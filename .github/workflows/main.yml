name: Android CI/CD Build and Test

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Agar project kisi subfolder mein hai toh '.' ki jagah folder ka naam dein (e.g. 'my-app')
env:
  PROJECT_PATH: '.'
  # Both are pinned in app/build.gradle.kts as well and MUST be installed before the first
  # Gradle invocation. AGP installs a missing package while it configures the project - i.e.
  # inside the very first `./gradlew` call - and that concurrent auto-download raced itself
  # (corrupt ZIP). Such a failure skipped the unit tests and both app builds.
  # 28.2.13676358 is the default NDK of Android Gradle plugin 9.1.
  CMAKE_VERSION: '3.22.1'
  NDK_VERSION: '28.2.13676358'

# One build per ref: a new push to a PR cancels the previous (still running) build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build, Test & Quality Checks
    # Pinned on purpose: the ubuntu-latest label migrates to Ubuntu 26 on 2026-10-19 and
    # would swap the preinstalled JDK/SDK in the middle of a release cycle.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # Kotlin compiler errors (`e: file:///…/Foo.kt:12:34 message`) become PR annotations
      # instead of a bare "Process completed with exit code 1".
      - name: Register Kotlin compiler problem matcher
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/kotlin-problem-matcher.json"

      # Preinstall CMake + NDK into the runner SDK so parallel ABI configure tasks never
      # race AGP's auto-download, and so the first Gradle call cannot fail on a missing
      # package. Runs before lint/tests/assemble on purpose.
      - name: Install Android SDK toolchain (CMake + NDK)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          if [ -d "$SDK_ROOT/cmake/$CMAKE_VERSION" ] && [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "CMake $CMAKE_VERSION and NDK $NDK_VERSION are already installed"
          else
            installed=0
            for attempt in 1 2 3; do
              if "$SDKMANAGER" --install "cmake;$CMAKE_VERSION" "ndk;$NDK_VERSION"; then
                installed=1
                break
              fi
              echo "sdkmanager install failed (attempt $attempt); retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            if [ "$installed" != "1" ]; then
              echo "Could not install CMake $CMAKE_VERSION / NDK $NDK_VERSION"
              exit 1
            fi
          fi

          test -d "$SDK_ROOT/cmake/$CMAKE_VERSION"
          test -d "$SDK_ROOT/ndk/$NDK_VERSION"
          echo "CMake: $(ls -d "$SDK_ROOT"/cmake/*)"
          echo "NDK:   $(ls -d "$SDK_ROOT"/ndk/*)"

      # Each Gradle step retries once: a shared runner can fail on a transient
      # network/daemon hiccup, and that must not turn into a red build.
      - name: Run Android Lint (Code Quality)
        run: |
          for attempt in 1 2; do
            if ./gradlew lintDebug --stacktrace; then exit 0; fi
            echo "lintDebug failed (attempt $attempt); retrying once"
            sleep 20
          done
          exit 1

      - name: Run Unit Tests
        run: |
          for attempt in 1 2; do
            if ./gradlew test --stacktrace; then exit 0; fi
            echo "unit tests failed (attempt $attempt); retrying once"
            sleep 20
          done
          exit 1

      # Failing JUnit cases -> PR annotations (test file + line + assertion message) and a
      # job-summary table, so a red test step can be diagnosed without opening the raw log.
      - name: Report failed unit tests
        if: failure()
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/report_test_failures.py" app/build/test-results

      - name: Build Debug APK
        run: |
          for attempt in 1 2; do
            if ./gradlew assembleDebug --stacktrace; then exit 0; fi
            echo "assembleDebug failed (attempt $attempt); retrying once"
            sleep 20
          done
          exit 1

      - name: Build Release Bundle (AAB)
        run: |
          for attempt in 1 2; do
            if ./gradlew bundleRelease --stacktrace; then exit 0; fi
            echo "bundleRelease failed (attempt $attempt); retrying once"
            sleep 20
          done
          exit 1

      # Keeps the reason of a future failure in the log instead of only in the Gradle console.
      - name: Gradle diagnostics on failure
        if: failure()
        run: |
          echo "===== gradle --version ====="
          ./gradlew --version || true
          echo "===== last Gradle daemon log ====="
          DAEMON_LOG="$(ls -t "$HOME"/.gradle/daemon/*/daemon-*.out.log 2>/dev/null | head -1 || true)"
          if [ -n "$DAEMON_LOG" ]; then tail -n 200 "$DAEMON_LOG"; else echo "no daemon log found"; fi
          echo "===== SDK toolchain ====="
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ls -d "$SDK_ROOT"/cmake/* "$SDK_ROOT"/ndk/* 2>/dev/null || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_PATH }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: ${{ env.PROJECT_PATH }}/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
