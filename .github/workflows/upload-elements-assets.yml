name: Upload Elements Assets to Firebase

# Manually triggered admin job: publishes the generated Shapes-panel asset
# library (firebase-assets/) to Firebase Storage + Firestore and deploys the
# Firestore/Storage security rules.
#
# One-time setup (repo owner only):
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#   Name:  FIREBASE_SERVICE_ACCOUNT
#   Value: the full contents of the Firebase service-account JSON key
#          (Firebase Console -> Project settings -> Service accounts ->
#           Generate new private key). The key never enters git or chat.
#
# Then: Actions tab -> "Upload Elements Assets to Firebase" -> Run workflow.
# The job is idempotent: re-running overwrites the same Storage paths and
# Firestore document IDs (220 assets + 11 categories).

on:
  workflow_dispatch:
    inputs:
      deploy_rules:
        description: "Also deploy firestore.rules + storage.rules"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: upload-elements-assets
  cancel-in-progress: false

jobs:
  upload:
    name: Upload 220 assets + 11 categories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uploader dependencies
        working-directory: tools/assets
        run: npm install --no-audit --no-fund

      - name: Validate seed before touching Firebase
        run: |
          python3 tools/assets/validate_seed.py
          node tools/assets/upload_firebase.js --dry-run

      - name: Write service-account key (from secret, never committed)
        env:
          # Accept the usual alternate names too, in case the secret was
          # created under one of them (Repository secrets, Actions tab only).
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.SERVICE_ACCOUNT_KEY || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.FIREBASE_ADMINSDK || secrets.FIREBASE_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Secret not found::No FIREBASE_SERVICE_ACCOUNT secret is visible to this workflow."
            echo "Fix: repo Settings -> Secrets and variables -> Actions -> 'Secrets' tab (NOT Variables, NOT Codespaces/Dependabot) -> New repository secret -> Name exactly: FIREBASE_SERVICE_ACCOUNT -> Value: full service-account JSON."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/serviceAccountKey.json"
          node -e "const k=require(process.env.RUNNER_TEMP+'/serviceAccountKey.json'); if(!k.project_id||!k.private_key){console.error('Secret is not a valid service-account JSON');process.exit(1)} console.log('Key OK for project:', k.project_id)"

      - name: Upload assets to Storage + Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/serviceAccountKey.json
        run: node tools/assets/upload_firebase.js

      - name: Verify Firestore contents
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/serviceAccountKey.json
        run: |
          cd tools/assets
          node -e "
          const admin=require('firebase-admin');
          admin.initializeApp({credential: admin.credential.applicationDefault()});
          (async()=>{
            const db=admin.firestore();
            const cats=await db.collection('categories').get();
            const pub=await db.collection('assets').where('status','==','published').get();
            console.log('categories in Firestore:', cats.size);
            console.log('published assets in Firestore:', pub.size);
            if(cats.size!==11||pub.size!==220){console.error('MISMATCH: expected 11 categories and 220 published assets');process.exit(1)}
            console.log('VERIFIED: 11 categories + 220 published assets are live.');
          })().catch(e=>{console.error(e);process.exit(1)});
          "

      - name: Deploy Firestore + Storage rules
        if: ${{ inputs.deploy_rules }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/serviceAccountKey.json
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules,storage:rules --project gen-lang-client-0291066258 --non-interactive

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/serviceAccountKey.json"
